      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  lanfi-cli:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    templates: [SharedToolchainSources]
    sources:
      - CLI
    dependencies:
      - package: LanFiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi.CLI
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.9"

schemes:
  LanFi:
    build:
      targets:
        LanFi: all
        LanFiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LanFiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  lanfi-cli:
    build:
      targets:
        lanfi-cli: all
    run:
      config: Release
    archive:
      config: Release
