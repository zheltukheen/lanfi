      - path: Models/RoamingTest.swift
      - path: Models/KnownNetwork.swift
      - path: Models/LinkTelemetry.swift
      - path: Models/CombinedReport.swift
      - path: Models/SecurityWatch.swift
      - path: Services/CombinedReportExporter.swift
      - path: Models/ColumnProfile.swift
      - path: Models/RemoteSensor.swift
      - path: Models/MenuBarAlert.swift
