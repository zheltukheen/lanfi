name: LanFi
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  LanFiCore:
    path: Packages/LanFiCore

options:
  bundleIdPrefix: ru.zheltukheen
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  LanFi:
    type: application
    platform: macOS
    sources:
      - LanFiApp.swift
      - Models
      - Services
      - ViewModels
      - Views
      - Utils
      # The MCP server ships inside the app binary as well, so agents can point
      # `claude mcp add` at LanFi.app/Contents/MacOS/LanFi --mcp directly.
      - CLI/MCPProtocol.swift
      - CLI/MCPServer.swift
      - CLI/MCPToolkit.swift
      - CLI/MCPToolkit+Arguments.swift
      - CLI/MCPToolkit+Encoding.swift
      - CLI/MCPToolkit+Probes.swift
      - CLI/MCPToolkit+Scan.swift
      - CLI/MCPToolkit+ServiceTools.swift
      - CLI/ScanExport.swift
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: LanFiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi
        MARKETING_VERSION: "5.5.4"
        CURRENT_PROJECT_VERSION: "77"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LanFi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleLocalizations: [en, ru, de, fr, zh-Hans]
        NSHumanReadableCopyright: "© 2026 LanFi Contributors"
        NSLocationUsageDescription: "LanFi uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSLocationWhenInUseUsageDescription: "LanFi uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSLocalNetworkUsageDescription: "LanFi scans your local network for the LAN Scanner and connects to remote sensors over SSH when you ask it to."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _spotify-connect._tcp
          - _sonos._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _pdl-datastream._tcp
          - _workstation._tcp
          - _device-info._tcp
          - _hap._tcp
          - _matter._tcp
          - _companion-link._tcp
          - _sleep-proxy._udp
        CFBundleURLTypes:
          - CFBundleURLName: ru.zheltukheen.LanFi
            CFBundleURLSchemes:
              - lanfi
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        SUFeedURL: "https://github.com/zheltukheen/lanfi/releases/latest/download/appcast.xml"
        SUPublicEDKey: "rFs9J6EODXIM2BpP2gHfe8C1KAZdkYNipngstUHolP8="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false

  LanFiTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
      - Models
      - Services
      - Utils
      - CLI
    dependencies:
      - package: LanFiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: LanFiCore
      - package: Sparkle

  lanfi-cli:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - CLI
      - Models
      - path: Services
        # The CLI never opens the updater; excluding it keeps Sparkle out of
        # the standalone `lanfi-cli` binary so it runs without an app bundle.
        excludes:
          - UpdaterController.swift
      - Utils
    dependencies:
      - package: LanFiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi.CLI
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.9"

schemes:
  LanFi:
    build:
      targets:
        LanFi: all
        LanFiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LanFiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  lanfi-cli:
    build:
      targets:
        lanfi-cli: all
    run:
      config: Release
    archive:
      config: Release
