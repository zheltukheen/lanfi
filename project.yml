name: LanFi
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

options:
  bundleIdPrefix: ru.zheltukheen
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  LanFi:
    type: application
    platform: macOS
    sources:
      - LanFiApp.swift
      - Models
      - Services
      - ViewModels
      - Views
      - Utils
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.WiFA
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "16"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LanFi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 LanFi Contributors"
        NSLocationUsageDescription: "LanFi uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSLocationWhenInUseUsageDescription: "LanFi uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSLocalNetworkUsageDescription: "LanFi connects to remote sensors on your local network over SSH when you ask it to."
        CFBundleURLTypes:
          - CFBundleURLName: ru.zheltukheen.LanFi
            CFBundleURLSchemes:
              - lanfi
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        SUFeedURL: "https://github.com/zheltukheen/wifa/releases/latest/download/appcast.xml"
        SUPublicEDKey: "rFs9J6EODXIM2BpP2gHfe8C1KAZdkYNipngstUHolP8="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false

  LanFiTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: Models/NetworkModel.swift
      - path: Models/ColumnCatalog.swift
      - path: Models/SignalDisplayMode.swift
      - path: Models/ProtocolProfile.swift
      - path: Models/DiagnosticsModel.swift
      - path: Models/NetworkAnnotation.swift
      - path: Models/ScanSession.swift
      - path: Models/NetworkGrouping.swift
      - path: Models/Survey.swift
      - path: Models/SystemInterface.swift
      - path: Models/ColumnProfile.swift
      - path: Models/RemoteSensor.swift
      - path: Models/MenuBarAlert.swift
      - path: Models/FilterProfile.swift
      - path: Models/ThroughputReport.swift
      - path: Services/SurveyInterpolator.swift
      - path: Services/SurveyReportExporter.swift
      - path: Services/LiveCaptureService.swift
      - path: Services/RemoteSensorService.swift
      - path: Services/NetworkAnalyzer.swift
      - path: Services/ProtocolAnalyzer.swift
      - path: Services/DiagnosticsEngine.swift
      - path: Services/DiagnosticsHistoryStore.swift
      - path: Services/DeepLink.swift
      - path: Services/CrashLogger.swift
      - path: Services/OUIUpdater.swift
      - path: Services/DiagnosticsBundleExporter.swift
      - path: Services/PcapExporter.swift
      - path: Services/PcapAnalyzer.swift
      - path: Services/SystemInterfaceScanner.swift
      - path: Services/APNameDetector.swift
      - path: Services/NetworkColumnFormatter.swift
      - path: Services/InformationElementParser.swift
      - path: Utils/OUIParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.WiFA.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  lanfi-cli:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - CLI
      - Models/NetworkModel.swift
      - Models/ProtocolProfile.swift
      - Services/NetworkAnalyzer.swift
      - Services/ProtocolAnalyzer.swift
      - Services/PcapAnalyzer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi.CLI
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.9"

schemes:
  LanFi:
    build:
      targets:
        LanFi: all
        LanFiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LanFiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  lanfi-cli:
    build:
      targets:
        lanfi-cli: all
    run:
      config: Release
    archive:
      config: Release
