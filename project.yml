name: LanFi
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  LanFiCore:
    path: Packages/LanFiCore

options:
  bundleIdPrefix: ru.zheltukheen
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targetTemplates:
  SharedToolchainSources:
    sources:
      - path: Models/NetworkModel.swift
      - path: Models/MCPToolSpec.swift
      - path: Models/ProtocolProfile.swift
