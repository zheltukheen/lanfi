name: WiFA
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

options:
  bundleIdPrefix: ru.zheltukheen
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  WiFA:
    type: application
    platform: macOS
    sources:
      - WifiAnalyzerApp.swift
      - Models
      - Services
      - ViewModels
      - Views
      - Utils
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.WiFA
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "11"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WiFA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 WiFA Contributors"
        NSLocationUsageDescription: "WiFA uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        SUFeedURL: "https://github.com/zheltukheen/wifa/releases/latest/download/appcast.xml"
        SUPublicEDKey: "rFs9J6EODXIM2BpP2gHfe8C1KAZdkYNipngstUHolP8="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false

  WiFATests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: Models/NetworkModel.swift
      - path: Models/ColumnCatalog.swift
      - path: Models/SignalDisplayMode.swift
      - path: Models/ProtocolProfile.swift
      - path: Models/DiagnosticsModel.swift
      - path: Models/NetworkAnnotation.swift
      - path: Models/ScanSession.swift
      - path: Models/NetworkGrouping.swift
      - path: Models/Survey.swift
      - path: Services/NetworkAnalyzer.swift
      - path: Services/ProtocolAnalyzer.swift
      - path: Services/DiagnosticsEngine.swift
      - path: Services/PcapExporter.swift
      - path: Services/NetworkColumnFormatter.swift
      - path: Services/InformationElementParser.swift
      - path: Utils/OUIParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.WiFA.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  WiFA:
    build:
      targets:
        WiFA: all
        WiFATests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WiFATests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
