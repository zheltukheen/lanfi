      - path: Models/SurveyAccessPoint.swift
      - path: Models/MLOInfo.swift
      - path: Models/MLOGroup.swift
      - path: Models/ToolkitModels.swift
      - path: Models/SubnetCalculator.swift
      - path: Models/PortSpec.swift
      - path: Services/Toolkit/DNSMessage.swift
      - path: Services/Toolkit/PingService.swift
      - path: Services/Toolkit/DNSClient.swift
      - path: Services/Toolkit/PortScanner.swift
      - path: Services/Toolkit/TLSCertificateInspector.swift
      - path: Services/Toolkit/TracerouteParser.swift
      - path: Services/Toolkit/TracerouteRunner.swift
      - path: Models/MTRModels.swift
      - path: Models/Iperf3Models.swift
      - path: Models/NetworkRoute.swift
      - path: Models/UptimeModels.swift
      - path: Models/LANModels.swift
      - path: Models/DNSPropagationModels.swift
      - path: Services/Toolkit/ServiceBannerProbe.swift
      - path: Models/WhoisModels.swift
      - path: Models/GeoIPModels.swift
      - path: Services/GeoIPClient.swift
      - path: Services/WhoisClient.swift
      - path: Services/UptimeStore.swift
      - path: Services/Toolkit/MTRService.swift
      - path: Models/DiagnosticsVerdict.swift
      - path: Models/EHTPuncturing.swift
      - path: Models/SpectrumSweep.swift
      - path: Models/DeviceShelfModels.swift
      - path: Services/DeviceShelfStore.swift
      - path: Services/LocalNetworkAccess.swift
      - path: Models/ThroughputReport.swift
      - path: Services/SurveyInterpolator.swift
      - path: Services/NetworkAnalyzer.swift
      - path: Services/ProtocolAnalyzer.swift
      - path: Services/DiagnosticsHistoryStore.swift
      - path: Services/PcapAnalyzer.swift
      - path: Services/PcapPacketIndex.swift
      - path: Services/SystemInterfaceScanner.swift
      - path: Services/InformationElementParser.swift
      - path: Services/SpectrumCSVImporter.swift
      - path: Utils/OUIParser.swift
      - path: Utils/MCPPaths.swift
      - path: Services/Toolkit/LANScannerService.swift
      - path: Services/Toolkit/BonjourDiscovery.swift
      - path: Services/DiagnosticsHistoryStore.swift
      - path: Services/UptimeStore.swift


targets:
  LanFi:
    type: application
    platform: macOS
    sources:
      - LanFiApp.swift
      - Models
      - Services
      - ViewModels
      - Views
      - Utils
      # The MCP server ships inside the app binary as well, so agents can point
      # `claude mcp add` at LanFi.app/Contents/MacOS/LanFi --mcp directly.
      - CLI/MCPProtocol.swift
      - CLI/MCPServer.swift
      - CLI/MCPToolkit.swift
      - CLI/MCPToolkit+Arguments.swift
      - CLI/MCPToolkit+Encoding.swift
      - CLI/MCPToolkit+Probes.swift
      - CLI/MCPToolkit+Scan.swift
      - CLI/MCPToolkit+ServiceTools.swift
      - CLI/ScanExport.swift
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: LanFiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zheltukheen.LanFi
        MARKETING_VERSION: "5.3.0"
        CURRENT_PROJECT_VERSION: "69"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LanFi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleLocalizations: [en, ru, de, fr, zh-Hans]
        NSHumanReadableCopyright: "© 2026 LanFi Contributors"
        NSLocationUsageDescription: "LanFi uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSLocationWhenInUseUsageDescription: "LanFi uses your location only so macOS can reveal Wi-Fi network names (SSIDs) and access point identifiers (BSSIDs). No location data leaves your Mac."
        NSLocalNetworkUsageDescription: "LanFi scans your local network for the LAN Scanner and connects to remote sensors over SSH when you ask it to."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _spotify-connect._tcp
          - _sonos._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _pdl-datastream._tcp
          - _workstation._tcp
          - _device-info._tcp
          - _hap._tcp
          - _matter._tcp
          - _companion-link._tcp
          - _sleep-proxy._udp
        CFBundleURLTypes:
          - CFBundleURLName: ru.zheltukheen.LanFi
            CFBundleURLSchemes:
              - lanfi
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        SUFeedURL: "https://github.com/zheltukheen/lanfi/releases/latest/download/appcast.xml"
        SUPublicEDKey: "rFs9J6EODXIM2BpP2gHfe8C1KAZdkYNipngstUHolP8="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false

  LanFiTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    templates: [SharedToolchainSources]
