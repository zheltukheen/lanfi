name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Swift
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift-format --version

      - name: Lint Swift
        run: |
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi
          FORMAT="xcrun swift-format"
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            FORMAT="swift-format"
          fi
          if [ -x scripts/lint.sh ]; then
            ./scripts/lint.sh
          else
            $FORMAT lint --recursive --configuration .swift-format --no-color-diagnostics .
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # GitHub no longer offers macOS 13 or macOS 14 runner images: a job on
    # either label is cancelled without running a step, which cancels the whole
    # run. The 13.0 deployment target is still compiled and tested by both
    # images that remain.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run core package tests
        run: swift test --package-path Packages/LanFiCore

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project LanFi.xcodeproj \
            -scheme LanFi \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

  ui-smoke:
    name: UI smoke
    runs-on: macos-15
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run UI smoke
        run: ./scripts/ui_smoke.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: ${{ runner.temp }}/lanfi-ui-smoke
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Performance budgets
    runs-on: macos-15
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run performance budgets
        run: |
          set -o pipefail
          xcodebuild test \
            -project LanFi.xcodeproj \
            -scheme LanFi \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -only-testing:LanFiTests/PerformanceBudgetTests \
            CODE_SIGNING_ALLOWED=NO

  build:
    name: Build universal app
    runs-on: macos-15
    needs: [test, ui-smoke]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: ./build.sh

      - name: Verify architectures
        run: lipo -archs build/LanFi-Universal/LanFi.app/Contents/MacOS/LanFi

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: LanFi.app
          path: build/LanFi-Universal/LanFi.app
          if-no-files-found: error
          retention-days: 14
