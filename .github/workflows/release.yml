name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lanfi-signing.keychain-db"
          KEYCHAIN_PASSWORD="lanfi-actions"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Lint
        run: |
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi
          FORMAT="xcrun swift-format"
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            FORMAT="swift-format"
          fi
          ./scripts/lint.sh

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LanFi.xcodeproj \
            -scheme LanFi \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(awk '/^[[:space:]]*MARKETING_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)"
          echo "Tag: ${VERSION}; project.yml: ${PROJECT_VERSION}"
          test "${VERSION}" = "${PROJECT_VERSION}" || {
            echo "Tag does not match MARKETING_VERSION in project.yml" >&2
            exit 1
          }

      - name: Build universal app
        env:
          CODESIGN_IDENTITY: ${{ env.DEVELOPER_ID_IDENTITY }}
        run: ./build.sh

      - name: Release smoke test
        run: ./scripts/release_smoke_test.sh build/LanFi-Universal/LanFi.app

      - name: Notarize app
        if: env.HAS_SIGNING == 'true'
        run: ./scripts/notarize.sh app build/LanFi-Universal/LanFi.app

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/LanFi-Universal/LanFi.app"
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/LanFi"

          mkdir -p build/dist build/dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" "build/dist/LanFi-${VERSION}.zip"

          cp -R "$APP" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "LanFi ${VERSION}" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "build/dist/LanFi-${VERSION}.dmg"

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        run: ./scripts/notarize.sh dmg "build/dist/LanFi-${GITHUB_REF_NAME#v}.dmg"

      - name: Checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/dist
          shasum -a 256 "LanFi-${VERSION}.zip" > "LanFi-${VERSION}.sha256"
          shasum -a 256 "LanFi-${VERSION}.dmg" >> "LanFi-${VERSION}.sha256"
          cat "LanFi-${VERSION}.sha256"

      - name: Build CLI
        run: |
          set -euo pipefail
          xcodebuild build \
            -project LanFi.xcodeproj \
            -scheme lanfi-cli \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
          CLI="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name lanfi-cli -type f | head -1)"
          "$CLI" help
          mkdir -p build/dist/cli
          cp "$CLI" build/dist/cli/lanfi-cli
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/dist
          zip -q "LanFi-CLI-${VERSION}.zip" cli/lanfi-cli
          shasum -a 256 "LanFi-CLI-${VERSION}.zip" >> "LanFi-${VERSION}.sha256"

      - name: Generate release notes
        run: python3 scripts/release_notes.py

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_PRIVATE_KEY is not configured; skipping appcast." >&2
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(awk '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)"
          echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/sparkle_private_key"
          chmod 600 "$RUNNER_TEMP/sparkle_private_key"

          curl -sSL --max-time 120 \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          ZIP="build/dist/LanFi-${VERSION}.zip"
          SIGNATURE="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle_private_key" -p "$ZIP")"
          LENGTH="$(stat -f%z "$ZIP")"
          python3 scripts/make_appcast.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "https://github.com/zheltukheen/wifa/releases/download/v${VERSION}/LanFi-${VERSION}.zip" \
            --signature "$SIGNATURE" \
            --length "$LENGTH" \
            --notes release_notes.md \
            --output build/dist/appcast.xml
          cat build/dist/appcast.xml

      - name: Update Homebrew cask
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "build/dist/LanFi-${VERSION}.dmg" | awk '{print $1}')"
          ./scripts/update_cask.sh "$VERSION" "$SHA"
          if git diff --quiet -- Casks/lanfi.rb; then
            exit 0
          fi
          git config user.name "LanFi Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/lanfi.rb
          git commit -m "chore: update Homebrew cask to ${VERSION}"
          git push origin HEAD:main

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            build/dist/LanFi-*.zip
            build/dist/LanFi-*.dmg
            build/dist/LanFi-*.sha256
            build/dist/appcast.xml
