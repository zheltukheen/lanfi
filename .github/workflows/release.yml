name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version

      - name: Lint
        run: |
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi
          FORMAT="xcrun swift-format"
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            FORMAT="swift-format"
          fi
          ./scripts/lint.sh

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project WiFA.xcodeproj \
            -scheme WiFA \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(awk '/^[[:space:]]*MARKETING_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)"
          echo "Tag: ${VERSION}; project.yml: ${PROJECT_VERSION}"
          test "${VERSION}" = "${PROJECT_VERSION}" || {
            echo "Tag does not match MARKETING_VERSION in project.yml" >&2
            exit 1
          }

      - name: Build universal app
        run: ./build.sh

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/WiFA-Universal/WiFA.app"
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/WiFA"

          mkdir -p build/dist build/dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" "build/dist/WiFA-${VERSION}.zip"

          cp -R "$APP" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "WiFA ${VERSION}" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "build/dist/WiFA-${VERSION}.dmg"

          cd build/dist
          shasum -a 256 "WiFA-${VERSION}.zip" > "WiFA-${VERSION}.sha256"
          shasum -a 256 "WiFA-${VERSION}.dmg" >> "WiFA-${VERSION}.sha256"
          cat "WiFA-${VERSION}.sha256"

      - name: Generate release notes
        run: python3 scripts/release_notes.py

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_PRIVATE_KEY is not configured; skipping appcast." >&2
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(awk '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)"
          echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/sparkle_private_key"
          chmod 600 "$RUNNER_TEMP/sparkle_private_key"

          curl -sSL --max-time 120 \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          ZIP="build/dist/WiFA-${VERSION}.zip"
          SIGNATURE="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle_private_key" -p "$ZIP")"
          LENGTH="$(stat -f%z "$ZIP")"
          python3 scripts/make_appcast.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "https://github.com/zheltukheen/wifa/releases/download/v${VERSION}/WiFA-${VERSION}.zip" \
            --signature "$SIGNATURE" \
            --length "$LENGTH" \
            --notes release_notes.md \
            --output build/dist/appcast.xml
          cat build/dist/appcast.xml

      - name: Update Homebrew cask
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "build/dist/WiFA-${VERSION}.dmg" | awk '{print $1}')"
          ./scripts/update_cask.sh "$VERSION" "$SHA"
          if git diff --quiet -- Casks/wifa.rb; then
            exit 0
          fi
          git config user.name "WiFA Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/wifa.rb
          git commit -m "chore: update Homebrew cask to ${VERSION}"
          git push origin HEAD:main

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            build/dist/WiFA-*.zip
            build/dist/WiFA-*.dmg
            build/dist/WiFA-*.sha256
            build/dist/appcast.xml
