name: Feature request
description: Suggest a capability or improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish? Who is it for?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning / radio data
        - Channel analysis / recommendations
        - Security audit
        - Table / filtering / UX
        - Charts / history
        - Export / automation
        - Build / CI / distribution
        - Documentation
        - Other
    validations:
      required: true
